<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>An evening in the City – link preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 1200×627 link preview, a landscape take on the K2 navy ticket post. Rendered by render_og.cjs. */
body { margin: 0; }
.card {
  position: relative; width: 1200px; height: 627px; overflow: hidden; box-sizing: border-box;
  padding: 48px 56px; background: #111b2c; color: #ffffff;
  font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 300;
}
.logos { display: flex; align-items: center; gap: 20px; }
.logos img { height: 32px; width: auto; }
.logos .x { font-size: 26px; line-height: 1; color: rgba(255, 255, 255, 0.6); }
.sub { margin: 14px 0 0; font-size: 26px; color: rgba(255, 255, 255, 0.88); }
.dot { color: #e0457f; }
h1 { margin: 34px 0 0; font-size: 64px; line-height: 1.04; font-weight: 500; letter-spacing: -1px; }
.ticket {
  --notch: 16px;
  position: absolute; left: 56px; right: 56px; bottom: 48px; height: 268px;
  display: grid; grid-template-columns: 250px 1fr 110px;
  border-radius: 16px; overflow: hidden; background: #f7f7f5; color: #16171a;
  box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.6);
}
.art { position: relative; background: #16233a; overflow: hidden; }
.art img { position: absolute; left: 6%; bottom: -4%; width: 92%; }
.main { display: grid; grid-template-columns: 1fr 1fr; align-content: center; gap: 18px 32px; padding: 30px 36px; }
.mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; color: #5a5c61; }
.kicker { grid-column: 1 / -1; margin: 0; font-size: 15px; }
.title { grid-column: 1 / -1; margin: -6px 0 6px; font-size: 40px; line-height: 1.05; font-weight: 500; }
.row p { margin: 0; }
.row .mono { font-size: 13px; }
.row .val { margin-top: 2px; font-size: 22px; line-height: 1.25; font-weight: 500; }
.stub { position: relative; display: grid; place-items: center; border-left: 3px dashed #c9cbcf; }
.stub::before, .stub::after { content: ''; position: absolute; left: calc(-1 * var(--notch) - 1.5px); width: calc(2 * var(--notch)); height: calc(2 * var(--notch)); border-radius: 50%; background: #111b2c; }
.stub::before { top: calc(-1 * var(--notch)); }
.stub::after { bottom: calc(-1 * var(--notch)); }
.stub span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: #16171a; }
</style>
</head>
<body>
<div class="card">
  <div class="logos">
    <img src="../assets/embrace-logo-white.svg" alt="Embrace">
    <span class="x">×</span>
    <img src="../assets/codemill-logo-white.svg" alt="Codemill">
    <span class="x">×</span>
    <img src="../assets/vionlabs-logo-white.svg" alt="Vionlabs">
  </div>
  <h1>Your seat for an evening in the City<span class="dot">.</span></h1>
  <p class="sub">For the people who run media operations. Request your place.</p>
  <div class="ticket">
    <div class="art"><img src="../assets/st-pauls.png" alt=""></div>
    <div class="main">
      <p class="kicker mono">Admit one · By invitation</p>
      <p class="title">An evening in the City</p>
      <div class="row"><p class="mono">Date</p><p class="val">Mon 16 Nov · 18:30 – 22:00</p></div>
      <div class="row"><p class="mono">Venue</p><p class="val">Vinoteca di Sartoria<br>21 Bloomberg Arcade</p></div>
    </div>
    <div class="stub"><span>16·11 · No slides</span></div>
  </div>
</div>
</body>
</html>
