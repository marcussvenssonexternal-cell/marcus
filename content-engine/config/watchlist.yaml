  - "Research: Nielsen The Gauge, Antenna, Ampere Analysis, MIDiA Research, Parks Associates, HUB Research"
topics:
  - churn, retention and default-service behaviour
  - price rises and bundling
  - FAST and AVOD growth, especially Europe and news
  - AI in media (agentic AI, gen-AI search inside streaming UIs, AI labelling, catalogue licensing for AI)
  - discovery and "too much choice"
  - European broadcasters' streaming strategies (BBC, ITVX, Channel 4, ProSieben, RTL, TF1+, SVT, NRK, Yle)
  - consolidation (Skydance/WBD, Sky/ITV)
  - sports streaming

