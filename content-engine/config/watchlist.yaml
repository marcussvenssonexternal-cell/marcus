# What the weekly Content Radar watches. Add, remove or fix entries freely; the next run
# picks them up. "site" is where the company publishes (blog or newsroom). Leave it empty
# if unknown and the run will look for it.

radar_url: https://claude.ai/artifact/UKwTmC8DtVMasqkdp3Xa2f

# Web searches are capped per session turn and shared by every research agent.
