<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deep Dives figure (blog style)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* The figure.html checklist in the vionlabs.com blog's own style (deep blue gradient, Inter, bright blue), to sit with beforeafter.html covers: a checklist of what is measured, with the one missing item set apart. Rendered to PNG by cover.js. */
:root {
  --ink: #061433;
  --panel: rgba(255, 255, 255, 0.07);
  --paper: #ffffff;
  --muted: #9fb0cc;
  --line: rgba(255, 255, 255, 0.16);
  --accent: #2f7bff;
  --warn: #ff8a6b;
  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "Inter", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; color: var(--paper);
  background: radial-gradient(120% 90% at 85% 0%, #1a4fb8 0%, rgba(26, 79, 184, 0) 55%), radial-gradient(90% 70% at 0% 100%, #0d2a6b 0%, rgba(13, 42, 107, 0) 60%), var(--ink); }
.fig { width: 1600px; height: 900px; padding: 96px 110px 0; display: grid; grid-template-rows: auto auto 1fr auto; gap: 0; }
.kicker { font: 700 22px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: #8fb3ff; }
h1 { margin: 22px 0 44px; font: 800 60px/1.08 var(--display); letter-spacing: -0.02em; max-width: 1200px; }
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; align-content: start; }
.item { border: 2px solid var(--line); display: flex; align-items: center; gap: 18px; font: 700 32px/1.2 var(--display); padding: 16px 22px; background: var(--panel); border-radius: 12px; }
.tick { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); position: relative; }
.tick::after { content: ""; position: absolute; left: 12px; top: 6px; width: 8px; height: 16px; border: solid #ffffff; border-width: 0 4px 4px 0; transform: rotate(45deg); }
.missing { margin-top: 26px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 24px; border: 3px solid var(--warn); border-radius: 12px; font: 700 34px/1.2 var(--display); }
.missing .x { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--warn); position: relative; margin-right: 18px; }
.missing .x::before, .missing .x::after { content: ""; position: absolute; left: 11px; top: 3px; width: 4px; height: 20px; background: var(--warn); transform: rotate(45deg); }
.missing .x::after { transform: rotate(-45deg); }
.missing .l { display: flex; align-items: center; }
.missing .tag { font: 500 24px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); white-space: nowrap; }
.foot { display: flex; justify-content: space-between; align-items: center; padding: 34px 0 48px; font: 500 22px/1 var(--mono); color: var(--muted); }
/* The official wordmark (assets/vionlabs-logo-white.svg, never redrawn), cropped to its ink because the file's viewBox pads it. --h is the ink height. */
.logo { --h: 30px; flex: none; overflow: hidden; height: var(--h); width: calc(var(--h) * 391.56 / 53.74); }
.logo img { display: block; height: calc(var(--h) * 93.333 / 53.74); margin: calc(var(--h) * -22.28 / 53.74) 0 0 calc(var(--h) * -19.875 / 53.74); }
</style>
</head>
<body>
<div class="fig">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div>
    <div class="items" id="items"></div>
    <div class="missing" id="missing" hidden><span class="l"><span class="x"></span><span id="missingText"></span></span><span class="tag" id="missingTag"></span></div>
  </div>
  <div class="foot"><span id="source"></span><span class="logo"><img src="assets/vionlabs-logo-white.svg" alt="Vionlabs"></span></div>
</div>
<script>
// Spec from cover.js: {kicker, title, items: [...], missing, missingTag, source}.
function draw(s) {
  document.getElementById("kicker").textContent = s.kicker || "";
  document.getElementById("title").textContent = s.title || "";
  var box = document.getElementById("items");
  (s.items || []).forEach(function (t) {
    var d = document.createElement("div"); d.className = "item";
    var k = document.createElement("span"); k.className = "tick";
    var l = document.createElement("span"); l.textContent = t;
    d.appendChild(k); d.appendChild(l); box.appendChild(d);
  });
  if (s.missing) {
    document.getElementById("missing").hidden = false;
    document.getElementById("missingText").textContent = s.missing;
    document.getElementById("missingTag").textContent = s.missingTag || "";
  }
  document.getElementById("source").textContent = s.source || "";
}
if (window.FIGURE) draw(window.FIGURE);
</script>
</body>
</html>
