<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deep Dives social image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* A 1080x1350 (4:5) LinkedIn feed image in the cover's visual language: a short headline over a big tension curve with the piece's break marks, a byline and a pointer to the long read. Rendered to PNG by cover.js. */
:root {
  --ink: #14212b;
  --paper: #f4f6f7;
  --muted: #93a3ae;
  --line: #2a3843;
  --accent: #4fc1c8;
  --warn: #ff7a5c;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--ink); color: var(--paper); }
.social { width: 1080px; height: 1350px; padding-top: 88px; display: grid; grid-template-rows: auto auto 1fr auto; }
.top { display: flex; justify-content: space-between; align-items: center; height: 34px; margin: 0 84px; }
.kicker { font: 500 28px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 64px 84px 0; font: 800 120px/1.02 var(--display); letter-spacing: -0.03em; text-wrap: balance; }
#chart { position: relative; min-height: 0; }
#chart svg { position: absolute; left: 0; top: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 32px; margin: 0 84px; padding: 40px 0 80px; border-top: 3px solid var(--line); }
.by { font: 500 30px/36px var(--display); color: var(--muted); white-space: nowrap; }
.by b { font-weight: 700; color: var(--paper); }
.cta { display: inline-flex; align-items: center; gap: 14px; height: 72px; padding: 0 30px; border: 3px solid var(--accent); border-radius: 36px; font: 700 30px/1 var(--display); color: var(--accent); white-space: nowrap; }
.cta svg { flex: none; }
.mark { font: 700 34px/1 var(--display); letter-spacing: -0.01em; color: var(--paper); display: flex; align-items: center; gap: 14px; }
.mark i { display: inline-grid; grid-template-columns: repeat(3, 8px); gap: 4px; align-items: end; height: 28px; }
.mark i b { display: block; width: 8px; background: var(--accent); border-radius: 2px; }
.mark i b:nth-child(1) { height: 12px; } .mark i b:nth-child(2) { height: 28px; } .mark i b:nth-child(3) { height: 20px; }
</style>
</head>
<body>
<div class="social">
  <div class="top"><span class="kicker" id="kicker"></span><span class="mark"><i><b></b><b></b><b></b></i>Vionlabs</span></div>
  <h1 id="headline"></h1>
  <div id="chart"></div>
  <div class="foot"><span class="by" id="by"></span><span class="cta"><span id="cta"></span><svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><path d="M2 11H22M13 2L23 11L13 20" fill="none" stroke="#4fc1c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
</div>
<script>
// Spec comes from cover.js: {kicker, headline, by, cta, marks: [{at: 0..1, label, tone: "good"|"bad"}]}.
// The headline is sized to the largest size that fits in three lines, so drawing runs again once the fonts are in.
function draw(spec) {
  document.getElementById("kicker").textContent = spec.kicker || "";
  // Keep one- and two-letter words on the line with the word after them ("ad breaks", "is the").
  var h1 = document.getElementById("headline");
  h1.textContent = (spec.headline || "").replace(/ (\S{1,2}) /g, " $1 ");
  for (var size = 120; size > 64; size -= 2) {
    h1.style.fontSize = size + "px";
    if (h1.scrollWidth <= h1.clientWidth && h1.offsetHeight <= 3 * 1.02 * size + 2) break;
  }
  // Byline: the name in bold, anything after the first comma muted ("Arash Pendari, CEO of Vionlabs").
  var by = document.getElementById("by"), cut = (spec.by || "").indexOf(",");
  by.innerHTML = "";
  var name = document.createElement("b"); name.textContent = cut < 0 ? spec.by || "" : spec.by.slice(0, cut);
  by.appendChild(name);
  if (cut >= 0) by.appendChild(document.createTextNode(spec.by.slice(cut)));
  document.getElementById("cta").textContent = spec.cta || "";
  curve(spec.marks || []);
}

function curve(marks) {
  var box = document.getElementById("chart"), W = box.clientWidth, H = box.clientHeight;
  // The cover's illustrative tension curve for a 90-minute film: rises, a resolved valley, a long climb to the climax.
  var P = [[0, .22], [.05, .30], [.10, .26], [.16, .44], [.22, .38], [.28, .60], [.315, .70], [.37, .16], [.43, .30], [.49, .52],
           [.54, .46], [.60, .60], [.66, .64], [.70, .74], [.74, .86], [.80, .62], [.86, .92], [.92, .40], [1, .24]];
  var X0 = 84, X1 = W - 84, BASE = H - 112, TOP = 150, FS = 36, LS = 2;
  function px(p) { return [X0 + p[0] * (X1 - X0), BASE - 26 - p[1] * (BASE - 26 - TOP)]; }
  var pts = P.map(px);
  function path(ps) {
    var d = "M" + ps[0][0].toFixed(1) + " " + ps[0][1].toFixed(1);
    for (var i = 0; i < ps.length - 1; i++) {
      var p0 = ps[i - 1] || ps[i], p1 = ps[i], p2 = ps[i + 1], p3 = ps[i + 2] || p2;
      var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      var c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += " C" + c1.map(function (v) { return v.toFixed(1); }).join(" ") + " " + c2.map(function (v) { return v.toFixed(1); }).join(" ") + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d;
  }
  function yAt(x) {
    for (var i = 0; i < P.length - 1; i++) if (x >= P[i][0] && x <= P[i + 1][0]) {
      var t = (x - P[i][0]) / (P[i + 1][0] - P[i][0]), s = t * t * (3 - 2 * t);
      return px([x, P[i][1] + (P[i + 1][1] - P[i][1]) * s])[1];
    }
    return BASE;
  }
  var line = path(pts);
  var h = '<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc1c8" stop-opacity="0.30"/><stop offset="1" stop-color="#4fc1c8" stop-opacity="0"/></linearGradient></defs>';
  h += '<path d="' + line + ' L' + X1 + ' ' + BASE + ' L' + X0 + ' ' + BASE + ' Z" fill="url(#fill)"/>';
  h += '<path d="' + line + '" fill="none" stroke="#4fc1c8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>';
  // Runtime ruler with scene boundaries.
  h += '<line x1="' + X0 + '" y1="' + BASE + '" x2="' + X1 + '" y2="' + BASE + '" stroke="#2a3843" stroke-width="4"/>';
  [.04, .09, .13, .19, .25, .3, .35, .41, .46, .51, .57, .63, .68, .72, .77, .83, .89, .95].forEach(function (x) {
    var X = X0 + x * (X1 - X0);
    h += '<line x1="' + X + '" y1="' + (BASE - 14) + '" x2="' + X + '" y2="' + (BASE + 14) + '" stroke="#2a3843" stroke-width="4"/>';
  });
  ["0:00", "1:30"].forEach(function (t, i) {
    h += '<text x="' + (i ? X1 : X0) + '" y="' + (BASE + 84) + '" fill="#93a3ae" font-family="IBM Plex Mono, monospace" font-weight="500" font-size="28" text-anchor="' + (i ? "end" : "start") + '">' + t + "</text>";
  });
  // Labels go above the curve anywhere under their text (Plex Mono is 0.6em a character), stay inside the margins,
  // and step up when they would run into the label before them.
  var placed = [];
  marks.slice().sort(function (a, b) { return a.at - b.at; }).forEach(function (m) {
    var X = X0 + m.at * (X1 - X0), Y = yAt(m.at), good = m.tone === "good";
    var c = good ? "#4fc1c8" : "#ff7a5c", text = String(m.label || "").toUpperCase().replace(/[<&>]/g, "");
    var half = (text.length * 0.6 * FS + (text.length - 1) * LS) / 2;
    var LX = Math.max(X0 + half, Math.min(X1 - half, X)), top = Y;
    for (var x = LX - half - 16; x <= LX + half + 16; x += 4) top = Math.min(top, yAt(Math.max(0, Math.min(1, (x - X0) / (X1 - X0)))));
    var LY = top - 64;
    placed.forEach(function (q) { if (LX - half < q.x1 + 24 && LY > q.y - FS - 20) LY = q.y - FS - 20; });
    LY = Math.max(FS, LY);
    placed.push({ x1: LX + half, y: LY });
    h += '<line x1="' + X + '" y1="' + (LY + 22) + '" x2="' + X + '" y2="' + (BASE - 34) + '" stroke="' + c + '" stroke-width="5"' + (good ? "" : ' stroke-dasharray="12 12"') + "/>";
    h += '<rect x="' + (X - 46) + '" y="' + (BASE - 34) + '" width="92" height="68" rx="10" fill="' + c + '"/>';
    h += '<text x="' + X + '" y="' + (BASE + 11) + '" fill="#14212b" font-family="IBM Plex Mono, monospace" font-weight="500" font-size="30" text-anchor="middle">AD</text>';
    h += '<circle cx="' + X + '" cy="' + Y + '" r="15" fill="#14212b" stroke="' + c + '" stroke-width="7"/>';
    h += '<text x="' + LX + '" y="' + LY + '" fill="' + c + '" font-family="IBM Plex Mono, monospace" font-weight="500" font-size="' + FS + '" text-anchor="middle" letter-spacing="' + LS + '">' + text + "</text>";
  });
  box.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" aria-hidden="true">' + h + "</svg>";
}

if (window.SOCIAL) {
  draw(window.SOCIAL);
  Promise.all(['800 120px "Schibsted Grotesk"', '700 30px "Schibsted Grotesk"', '500 30px "Schibsted Grotesk"', '500 28px "IBM Plex Mono"'].map(function (f) { return document.fonts.load(f); }))
    .then(function () { draw(window.SOCIAL); });
}
</script>
</body>
</html>
