# The Vionlabs marketing agent team that Atlas coordinates. Atlas reads this file at the start
# of every run and updates it when an agent, session or routine changes.
#
# This repo is public. Keep budgets, spend, MQLs, ad account IDs and target companies out of
# this file: they live in the private strategy doc (see operating.yaml).
#
# brief_to: the session Atlas sends briefs to with send_message. For agents whose routine runs
#   in a fresh session each time, the home session owns the routine's procedure and config, so
#   it changes those files and the next run picks the brief up.
# health: how Atlas checks the agent is working (see AGENT.md, "Fleet health").

orchestrator:
  name: Atlas
  session_id: session_01V9gwdoCjyZ2JYMtRftvuCt
  procedure: marketing-hq/AGENT.md
  branch: claude/eager-knuth-ilc8g5
  routines:
    - { name: Marketing HQ weekly plan, trigger_id: trig_019Xs9724TSBH3UoWkNjRq9u, when: Mon 08:38, runs_in: this session }
    - { name: Marketing HQ Friday wrap, trigger_id: trig_01Fx9qSjkhYqADhtS3R8epx2, when: Fri 14:38, runs_in: this session }

